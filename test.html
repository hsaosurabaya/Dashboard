<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="output">Loading...</div>
<script>
const CSV_URL = 'https://raw.githubusercontent.com/hsaosurabaya/hsao/main/master_data_penjualan.csv';

fetch(CSV_URL)
  .then(res => res.text())
  .then(csv => {
    document.getElementById('output').innerHTML = 'CSV loaded! Panjang: ' + csv.length + ' karakter';
    const parsed = Papa.parse(csv, { header: true });
    document.getElementById('output').innerHTML += '<br>Jumlah baris data: ' + parsed.data.length;
    console.log('Sample:', parsed.data[0]);
  })
  .catch(err => {
    document.getElementById('output').innerHTML = 'Error: ' + err.message;
  });
</script>
</body>
</html>
